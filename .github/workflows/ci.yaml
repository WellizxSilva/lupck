name: CI Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential g++ make liblua5.4-dev luarocks python3

      - name: Build project
        run: |
          make clean
          make EMBED=1

      - name: Test binary
        run: |
          chmod +x ./lupck
          ./lupck --help

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSYS2 and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-lua
            python

      - name: Build project (Windows)
        shell: msys2 {0}
        run: |
          mingw32-make clean
          mingw32-make EMBED=1

      - name: Test binary
        shell: msys2 {0}
        run: ./lupck.exe --help
